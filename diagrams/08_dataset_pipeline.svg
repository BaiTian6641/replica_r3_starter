<text x="867" y="469" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Schema + chronological checks</text>
<text x="867" y="486" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Source entailment / executable oracle</text>
<text x="867" y="503" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Deduplication across lineage splits</text>
<text x="867" y="520" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Semantic verifier integration pending</text>
<rect x="455" y="415" width="290" height="110" rx="12" fill="#EAF0FA" stroke="#416EAB" stroke-width="1.5"/>
<text x="472" y="446" fill="#416EAB" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Development + calibration</text>
<text x="472" y="470" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Separately validated held-out tasks</text>
<text x="472" y="488" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Tune settings; keep audit answers hidden</text>
<rect x="455" y="580" width="290" height="80" rx="12" fill="#E6F4EE" stroke="#21856C" stroke-width="1.5"/>
<text x="472" y="611" fill="#21856C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Verified training examples</text>
<text x="472" y="634" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Response masks + reproducible manifests</text>
<rect x="60" y="415" width="290" height="135" rx="12" fill="#FCEEF0" stroke="#B35665" stroke-width="1.5"/>
<text x="77" y="446" fill="#B35665" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Sealed audit / benchmarks</text>
<text x="77" y="469" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Never supplied to the teacher</text>
<text x="77" y="486" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">No test answers in generated practice</text>
<text x="77" y="503" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Separate access log and final gate</text>
<text x="77" y="520" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Public release is not train permission</text>
