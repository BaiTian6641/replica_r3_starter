<text x="72" y="106" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Build data lineage before asking a teacher to expand it</text>
<text x="72" y="130" fill="#546B83" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Public task data teaches generic mechanisms; authentic source records establish the personal replica.</text>
