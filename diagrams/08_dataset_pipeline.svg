<text x="77" y="217" fill="#416EAB" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Eligible source material</text>
<text x="77" y="241" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Licensed public training material</text>
<text x="77" y="259" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Consented personal source records</text>
<text x="77" y="277" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Programmatically verifiable tasks</text>
<rect x="455" y="185" width="290" height="115" rx="12" fill="#E6F4EE" stroke="#21856C" stroke-width="1.5"/>
<text x="472" y="216" fill="#21856C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Assign lineage + split first</text>
<text x="472" y="240" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Person / source event / task family</text>
<text x="472" y="258" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Freeze train, dev and audit roots</text>
<text x="472" y="276" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Derived variants inherit their split</text>
<rect x="850" y="185" width="290" height="115" rx="12" fill="#EAF0FA" stroke="#416EAB" stroke-width="1.5"/>
<text x="867" y="217" fill="#416EAB" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Teacher expansion</text>
<text x="867" y="241" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Training roots only</text>
<text x="867" y="259" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Preserve sources and uncertainty</text>
<text x="867" y="277" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Do not invent personal memories</text>
