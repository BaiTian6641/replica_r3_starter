<text x="72" y="764" fill="#546B83" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start">Proposed research architecture; CPU contract tests are not model-quality evidence.</text>
<text x="1128" y="763" fill="#546B83" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="end">23 OCT 2026</text>
