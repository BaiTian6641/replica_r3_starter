<text x="72" y="106" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Causal memory: support before query, commit after read</text>
<text x="72" y="130" fill="#546B83" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">A shared immutable chunk-start state prevents one query token from seeing a later write in the same chunk.</text>
