<text x="77" y="605" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Training labels may supervise loss</text>
<text x="77" y="623" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Excluded from writer + workspace</text>
