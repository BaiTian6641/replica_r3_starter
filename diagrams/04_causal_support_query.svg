<text x="77" y="227" fill="#21856C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Earlier support events</text>
<text x="77" y="252" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Known before the query</text>
<text x="77" y="271" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Eligible observed records only</text>
<rect x="500" y="195" width="630" height="110" rx="12" fill="#FFF3D9" stroke="#B88623" stroke-width="1.5"/>
<text x="517" y="227" fill="#B88623" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Current query chunk</text>
<text x="517" y="252" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Tokens are processed under the native causal mask</text>
<text x="517" y="271" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Every query read uses the same M[k] snapshot</text>
<rect x="60" y="365" width="300" height="110" rx="12" fill="#E6F4EE" stroke="#21856C" stroke-width="1.5"/>
<text x="77" y="397" fill="#21856C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Support writer</text>
<text x="77" y="422" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">No sealed answers or future events</text>
<text x="77" y="441" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">No persistent mutation in forward</text>
<rect x="500" y="365" width="270" height="110" rx="12" fill="#FFF3D9" stroke="#B88623" stroke-width="1.5"/>
<text x="517" y="396" fill="#B88623" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">M[k]: chunk-start state</text>
<text x="517" y="420" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Immutable for all chunk reads</text>
<text x="517" y="438" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Private task / stream ownership</text>
<rect x="880" y="365" width="250" height="110" rx="12" fill="#FFF3D9" stroke="#B88623" stroke-width="1.5"/>
<text x="897" y="396" fill="#B88623" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Read + output</text>
<text x="897" y="420" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Query hidden state reads M[k]</text>
<text x="897" y="438" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Task loss / verified outcome</text>
<rect x="880" y="550" width="250" height="105" rx="12" fill="#E6F4EE" stroke="#21856C" stroke-width="1.5"/>
<text x="897" y="581" fill="#21856C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Functional update</text>
<text x="897" y="605" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">After the chunk reads finish</text>
<text x="897" y="623" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Return a new state object</text>
<rect x="500" y="550" width="270" height="105" rx="12" fill="#FFF3D9" stroke="#B88623" stroke-width="1.5"/>
<text x="517" y="581" fill="#B88623" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">M[k+1]: next state</text>
<text x="517" y="605" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Visible only to the next chunk</text>
<text x="517" y="623" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Commit once outside recompute</text>
<rect x="60" y="550" width="300" height="105" rx="12" fill="#FCEEF0" stroke="#B35665" stroke-width="1.5"/>
