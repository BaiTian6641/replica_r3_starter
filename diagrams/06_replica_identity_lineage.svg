<text x="66" y="660" fill="#546B83" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Mode is explicit: source_snapshot, source_current, parallel_replica or assistant_for_source. Agent history never silently rewrites human history.</text></svg>
