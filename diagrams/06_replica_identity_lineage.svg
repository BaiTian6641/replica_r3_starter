<text x="472" y="530" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Decision and process agreement</text>
<text x="472" y="548" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">Unknown-biography behavior</text>
