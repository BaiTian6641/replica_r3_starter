<text x="72" y="106" fill="#162A43" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Replica identity has a source and a separate branch</text>
<text x="72" y="130" fill="#546B83" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Preserve source attribution while permitting a familiar parallel system to acquire its own experience.</text>
